name: LiveBet CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livebet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Pruebas y validaciones
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B verify

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Comprobar que no se versionaron secretos
        run: |
          test ! -f .env
          ! git grep -nE '(MAIL_PASSWORD|AWS_SECRET_ACCESS_KEY|MERCADOPAGO_ACCESS_TOKEN|MERCADOPAGO_WEBHOOK_SECRET)=[^$<{]' -- \
            ':!.env.example' ':!README.md' ':!docs/**' ':!.github/workflows/pipeline.yml'

  package:
    name: Crear entrega inmutable
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checksum: ${{ steps.release.outputs.checksum }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Empaquetar solo archivos versionados
        id: release
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="livebet-${GITHUB_SHA}.tgz"
          git archive --format=tar.gz --output="$artifact_name" HEAD
          checksum="$(sha256sum "$artifact_name" | awk '{print $1}')"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Guardar paquete de la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: livebet-release-${{ github.sha }}
          path: ${{ steps.release.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Desplegar en ${{ github.ref_name == 'main' && 'producción' || 'desarrollo' }}
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    needs: package
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ github.ref_name == 'main' && 'livebet-production' || 'livebet-development' }}
    timeout-minutes: 35
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.DASHBOARD_URL }}
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Descargar paquete aprobado
        uses: actions/download-artifact@v8
        with:
          name: livebet-release-${{ github.sha }}

      - name: Validar configuración del entorno
        env:
          DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          API_URL: ${{ vars.API_URL }}
          LIVEBET_DOMAIN: ${{ vars.LIVEBET_DOMAIN }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_URL"
          test -n "$API_URL"
          test -n "$LIVEBET_DOMAIN"
          test -n "$PRODUCTION_ENV"
          if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
            test -n "$MERCADOPAGO_ACCESS_TOKEN"
          fi

      - name: Preparar configuración privada
        env:
          DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          LIVEBET_DOMAIN: ${{ vars.LIVEBET_DOMAIN }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > /tmp/livebet-production.env
          for key in LIVEBET_DOMAIN LIVEBET_DOMAINS MERCADOPAGO_ENABLED MERCADOPAGO_ACCESS_TOKEN MERCADOPAGO_WEBHOOK_SECRET MERCADOPAGO_SUCCESS_URL MERCADOPAGO_PENDING_URL MERCADOPAGO_FAILURE_URL SIMULATED_PAYMENTS_ENABLED; do
            sed -i "/^${key}=/d" /tmp/livebet-production.env
          done
          {
            printf 'LIVEBET_DOMAIN=%s\n' "$LIVEBET_DOMAIN"
            if [[ "$DEPLOYMENT_ENV" == "production" && "$LIVEBET_DOMAIN" == "livebet.beauty" ]]; then
              printf 'LIVEBET_DOMAINS=%s, www.%s, livebet.18.224.52.92.nip.io\n' "$LIVEBET_DOMAIN" "$LIVEBET_DOMAIN"
            else
              printf 'LIVEBET_DOMAINS=%s\n' "$LIVEBET_DOMAIN"
            fi
            printf 'MERCADOPAGO_WEBHOOK_SECRET=%s\n' "${MERCADOPAGO_WEBHOOK_SECRET:-}"
            printf 'MERCADOPAGO_SUCCESS_URL=https://%s/?payment=success\n' "$LIVEBET_DOMAIN"
            printf 'MERCADOPAGO_PENDING_URL=https://%s/?payment=pending\n' "$LIVEBET_DOMAIN"
            printf 'MERCADOPAGO_FAILURE_URL=https://%s/?payment=failure\n' "$LIVEBET_DOMAIN"
            if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
              printf 'MERCADOPAGO_ENABLED=true\n'
              printf 'MERCADOPAGO_ACCESS_TOKEN=%s\n' "$MERCADOPAGO_ACCESS_TOKEN"
              printf 'SIMULATED_PAYMENTS_ENABLED=false\n'
            else
              printf 'MERCADOPAGO_ENABLED=false\n'
              printf 'SIMULATED_PAYMENTS_ENABLED=true\n'
              printf 'COMPOSE_PROJECT_NAME=livebet-development\n'
            fi
          } >> /tmp/livebet-production.env

      - name: Desplegar versión con reversión automática
        env:
          ARTIFACT_CHECKSUM: ${{ needs.package.outputs.checksum }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_url="file://$(realpath "$ARTIFACT_NAME")"
          artifact_url_b64="$(printf '%s' "$artifact_url" | base64 -w 0)"
          sudo scripts/deploy-release.sh \
            "$artifact_url_b64" \
            "$ARTIFACT_CHECKSUM" \
            "$GITHUB_SHA" \
            /tmp/livebet-production.env

      - name: Eliminar copia temporal de configuración
        if: always()
        run: sudo rm -f /tmp/livebet-production.env

      - name: Verificar sitio público
        env:
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "$DASHBOARD_URL/actuator/health"
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "$API_URL/actuator/health"

      - name: Mostrar diagnóstico del proxy HTTPS
        if: always()
        run: |
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          sudo docker logs --tail=100 "$(sudo docker ps --format '{{.Names}}' | grep -E 'edge-proxy' | head -n 1)" || true

      - name: Resumen del despliegue
        run: |
          {
            echo "## LiveBet desplegado en ${{ github.ref_name == 'main' && 'producción' || 'desarrollo' }}"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Dashboard: ${{ vars.DASHBOARD_URL }}"
            echo "- API: ${{ vars.API_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
