server.port: 8081
spring:
  application.name: betting-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres-db:5432/betting}
    username: ${POSTGRES_USER:betting}
    password: ${POSTGRES_PASSWORD:betting_secret}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    username: ${RABBITMQ_USER:betting}
    password: ${RABBITMQ_PASSWORD:betting_secret}
management.endpoints.web.exposure.include: health,info
livebet:
  jwt-secret: ${JWT_SECRET:dev-secret-change-this-livebet-2026}
  token-hours: 12
  initial-balance: 250000
  admin-email: ${ADMIN_EMAIL:admin@livebet.co}
  admin-password: ${ADMIN_PASSWORD:Admin123!}
  simulated-payments-enabled: ${SIMULATED_PAYMENTS_ENABLED:false}
  mercado-pago:
    enabled: ${MERCADOPAGO_ENABLED:false}
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    success-url: ${MERCADOPAGO_SUCCESS_URL:http://localhost:8080/?payment=success}
    pending-url: ${MERCADOPAGO_PENDING_URL:http://localhost:8080/?payment=pending}
    failure-url: ${MERCADOPAGO_FAILURE_URL:http://localhost:8080/?payment=failure}
